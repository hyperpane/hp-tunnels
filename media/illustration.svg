  <text x="474" y="78" fill="#06231e" font-weight="700">Share</text>

  <!-- Tunnel 1: live -->
  <g transform="translate(16 122)">
    <circle cx="5" cy="9" r="5" fill="#3fb950"/>
    <circle cx="5" cy="9" r="9" fill="#3fb950" fill-opacity="0.18"/>
    <text x="20" y="14" fill="#f4f6fb" font-weight="600">web</text>
    <text x="52" y="14" fill="#9aa3b6">:3000</text>
    <rect x="96" y="0" width="104" height="19" rx="5" fill="none" stroke="#262d3c"/>
    <text x="148" y="13.5" fill="#9aa3b6" font-size="10.5" text-anchor="middle">HTTP · tunnl.gg</text>
    <use href="#tn-restart" transform="translate(406 2) scale(0.6)"/>
    <use href="#tn-trash" transform="translate(432 2) scale(0.6)"/>

    <use href="#tn-open" transform="translate(290 30) scale(0.56)"/>
    <text x="20" y="66" fill="#9aa3b6" font-size="12">Live 14 min ago</text>
  </g>
  <line x1="16" y1="306" x2="524" y2="306" stroke="#232a38"/>

  <!-- Tunnel 3: TCP, reconnecting -->
  <g transform="translate(16 322)">
    <circle cx="5" cy="9" r="5" fill="#d29922"/>
    <text x="20" y="14" fill="#f4f6fb" font-weight="600">postgres</text>
    <text x="82" y="14" fill="#9aa3b6">:5432</text>
    <rect x="126" y="0" width="98" height="19" rx="5" fill="none" stroke="#262d3c"/>
    <text x="175" y="13.5" fill="#9aa3b6" font-size="10.5" text-anchor="middle">TCP · bore.pub</text>
    <use href="#tn-restart" transform="translate(406 2) scale(0.6)"/>
    <use href="#tn-trash" transform="translate(432 2) scale(0.6)"/>
    <rect x="470" y="0" width="38" height="20" rx="10" fill="#2bc3a6"/>
    <circle cx="498" cy="10" r="7.5" fill="#ffffff"/>
    <text x="20" y="42" fill="#c9d1e0" fill-opacity="0.5" font-family="'JetBrains Mono', Menlo, monospace" font-size="12">bore.pub:41873</text>
    <use href="#tn-copy" transform="translate(134 30) scale(0.56)"/>
    <text x="20" y="66" fill="#9aa3b6" font-size="12">Reconnecting…</text>

    <circle cx="498" cy="10" r="7.5" fill="#ffffff"/>
    <text x="20" y="42" fill="#2bc3a6" font-weight="500">k3x9vq7m.tunnl.gg</text>
    <use href="#tn-copy" transform="translate(146 30) scale(0.56)"/>
    <use href="#tn-open" transform="translate(170 30) scale(0.56)"/>
    <text x="20" y="66" fill="#9aa3b6" font-size="12">Live 2 h ago · same address every time</text>
  </g>
  <line x1="16" y1="206" x2="524" y2="206" stroke="#232a38"/>

  <!-- Tunnel 2: live -->
  <g transform="translate(16 222)">
    <circle cx="5" cy="9" r="5" fill="#3fb950"/>
    <circle cx="5" cy="9" r="9" fill="#3fb950" fill-opacity="0.18"/>
    <text x="20" y="14" fill="#f4f6fb" font-weight="600">api</text>
    <text x="44" y="14" fill="#9aa3b6">:8080</text>
    <rect x="88" y="0" width="114" height="19" rx="5" fill="none" stroke="#262d3c"/>

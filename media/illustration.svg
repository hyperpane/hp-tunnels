  <line x1="66" y1="16" x2="66" y2="46" stroke="#262d3c"/><line x1="114" y1="16" x2="114" y2="46" stroke="#262d3c"/>
  <text x="41" y="36" fill="#f4f6fb" font-weight="600" text-anchor="middle">HTTP</text>
  <text x="90" y="36" fill="#9aa3b6" text-anchor="middle">TCP</text>
  <text x="140" y="36" fill="#5d6678" text-anchor="middle">UDP</text>
  <rect x="176" y="16" width="348" height="30" rx="7" fill="#0c0f15" stroke="#262d3c"/>
  <text x="190" y="36" fill="#f4f6fb">tunnl.gg <tspan fill="#9aa3b6">· ssh, port 22</tspan></text>
  <path d="M502 28l5 5 5-5" fill="none" stroke="#9aa3b6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16" y="58" width="110" height="30" rx="7" fill="#0c0f15" stroke="#2bc3a6" stroke-opacity="0.7"/>
  <text x="28" y="78" fill="#f4f6fb" font-family="'JetBrains Mono', Menlo, monospace" font-size="12.5">5173</text>
  <rect x="136" y="58" width="170" height="30" rx="7" fill="#0c0f15" stroke="#262d3c"/>
  <text x="148" y="78" fill="#5d6678">Name (optional)</text>
  <rect x="318" y="66" width="14" height="14" rx="3.5" fill="#2bc3a6"/>
  <path d="M321.5 73.2l2.6 2.6 4.6-4.8" fill="none" stroke="#0c0f15" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="339" y="78" fill="#9aa3b6">Same address</text>
